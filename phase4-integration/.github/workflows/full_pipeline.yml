name: Full AI-Assisted QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * *'

jobs:
  full-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: phase4-integration
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run full pipeline
        working-directory: phase4-integration
        run: python pipeline.py --config pipeline_config.yaml

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-assisted-qa-pipeline-reports
          path: |
            phase4-integration/reports/
            phase4-integration/dashboard/
            phase4-integration/logs/
            phase1-foundation/reports/
            phase2-automation/reports/
            phase3-ai/**/reports/
          retention-days: 30
