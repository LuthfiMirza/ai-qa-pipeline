name: Full QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * *'

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: phase4-integration
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: phase4-integration
        run: python pipeline.py --config pipeline_config.yaml

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-pipeline-reports
          path: phase4-integration/reports/
          retention-days: 30
